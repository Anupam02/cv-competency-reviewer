[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-competency-reviewer"
version = "0.1.0"
description = "Evidence-based AI technical competency review from a candidate CV. Does not make hiring decisions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CV Competency Reviewer" }]
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.12,<1",
    "pypdf>=5.1.0,<7",
    "python-docx>=1.1.2,<2",
    "numpy>=1.26.0,<3",
    "openai>=1.55.0,<4",
    "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.3.0,<6",
]
dev = [
    "pytest>=8.3.0,<10",
    "httpx>=0.27.0,<1",
]

[project.scripts]
cv-review = "cv_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_reviewer = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
